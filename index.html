<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bateria IC-002 — redacció de casos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAFAF7; --panel:#FFFFFF; --ink:#14202B; --soft:#5A6B7A;
  --rule:#E2E4DE; --rule-hard:#C9CDC5;
  --yes:#1F7A4D; --yes-bg:#EAF3ED; --no:#9C4A1A; --no-bg:#F7EFE7;
  --accent:#2D5B8E; --accent-bg:#EBF0F6;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
     font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
textarea,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- shell ---------- */
.app{display:flex;flex-direction:column;height:100vh}
.bar{display:flex;align-items:center;gap:18px;padding:10px 18px;
     border-bottom:1px solid var(--rule-hard);background:var(--panel);flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:-.01em}
.brand span{color:var(--soft);font-weight:400}
.tabs{display:flex;gap:2px;background:var(--paper);padding:2px;border-radius:7px;
      border:1px solid var(--rule)}
.tabs button{border:0;background:none;padding:5px 13px;border-radius:5px;color:var(--soft)}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);
      box-shadow:0 1px 2px rgba(20,32,43,.10);font-weight:600}
.bar-end{margin-left:auto;display:flex;align-items:center;gap:10px}
.count{font-variant-numeric:tabular-nums;color:var(--soft);font-size:13.5px}
.count b{color:var(--ink)}
.btn{border:1px solid var(--rule-hard);background:var(--panel);padding:6px 12px;border-radius:6px}
.btn:hover{background:var(--paper)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{opacity:.88}

/* ---------- layout ---------- */
.main{display:flex;flex:1;min-height:0}
.rail{width:274px;flex:0 0 274px;border-right:1px solid var(--rule-hard);
      background:var(--panel);display:flex;flex-direction:column;min-height:0}
.stage{flex:1;overflow-y:auto;min-width:0}
.stage-in{max-width:760px;margin:0 auto;padding:26px 30px 90px}

/* ---------- coverage grid ---------- */
.grid-wrap{padding:14px 14px 12px;border-bottom:1px solid var(--rule)}
.grid-title{font-size:12.5px;color:var(--soft);margin:0 0 9px}
table.cov{border-collapse:collapse;width:100%;font-size:12px}
table.cov th{font-weight:500;color:var(--soft);padding:0 0 5px;text-align:center}
table.cov th.rh{text-align:left;padding-right:6px;width:42px}
table.cov td{padding:1px}
.cell{width:100%;border:1px solid var(--rule);background:var(--paper);border-radius:4px;
      padding:5px 0;position:relative;overflow:hidden;font-variant-numeric:tabular-nums;
      font-size:11px;color:var(--soft);display:block}
.cell .fill{position:absolute;inset:auto 0 0 0;background:var(--accent-bg);z-index:0}
.cell .n{position:relative;z-index:1}
.cell[data-done="1"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.cell[aria-current="true"]{outline:2px solid var(--ink);outline-offset:-1px}
.cell.void{visibility:hidden}
.cov-legend{font-size:11.5px;color:var(--soft);margin:8px 0 0;line-height:1.45}

/* ---------- case list ---------- */
.list{overflow-y:auto;flex:1;padding:6px 8px 20px}
.list-h{display:flex;align-items:baseline;gap:8px;padding:9px 6px 5px}
.list-h h3{margin:0;font-size:12.5px;color:var(--soft);font-weight:500}
.list-h button{margin-left:auto;border:0;background:none;font-size:12px;color:var(--accent);padding:0}
.item{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;
      background:none;padding:6px 8px;border-radius:6px;border-left:3px solid transparent}
.item:hover{background:var(--paper)}
.item[aria-current="true"]{background:var(--accent-bg);border-left-color:var(--accent)}
.item .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;background:var(--rule-hard)}
.item[data-filled="1"] .dot{background:var(--accent)}
.item .lbl{font-family:var(--mono);font-size:11.5px;color:var(--soft);flex:0 0 auto}
.item[data-filled="1"] .lbl{color:var(--ink)}
.item .pk{font-size:12.5px;color:var(--soft);white-space:nowrap;overflow:hidden;
      text-overflow:ellipsis;min-width:0}

/* ---------- editor ---------- */
.crumb{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 16px}
.crumb .id{font-family:var(--mono);font-size:12.5px;color:var(--soft)}
.chip{font-size:12px;padding:2px 9px;border-radius:20px;border:1px solid var(--rule-hard);
      background:var(--panel);white-space:nowrap}
.chip.yes{background:var(--yes-bg);border-color:#BFDBCB;color:var(--yes);font-weight:600}
.chip.no{background:var(--no-bg);border-color:#E3CDB8;color:var(--no);font-weight:600}

.bubble{border:1px solid var(--rule-hard);border-radius:11px;background:var(--panel);
        padding:15px 18px 16px;margin:0 0 6px}
.bubble .who{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--soft);
        margin:0 0 9px}
.bubble .body{font-family:var(--serif);font-size:16.5px;line-height:1.62;white-space:pre-wrap}
.bubble .body .q{display:block;margin-top:.7em;font-weight:600}
.src-note{font-size:12px;color:var(--soft);margin:0 0 22px;padding-left:2px}

.brief{border-left:3px solid var(--rule-hard);padding:2px 0 2px 14px;margin:0 0 24px}
.brief dt{font-size:12.5px;color:var(--soft);margin:0 0 2px}
.brief dd{margin:0 0 12px;font-family:var(--serif);font-size:15.5px;line-height:1.55}
.brief dd:last-child{margin-bottom:0}

.field{margin:0 0 20px}
.field label{display:block;font-size:13.5px;font-weight:600;margin:0 0 3px}
.field .help{font-size:12.5px;color:var(--soft);margin:0 0 7px;line-height:1.45}
.field textarea{width:100%;border:1px solid var(--rule-hard);border-radius:8px;
      padding:11px 13px;background:var(--panel);resize:vertical;line-height:1.55}
.field textarea.answer{font-family:var(--mono);font-size:14px;min-height:96px}
.field textarea.note{font-size:14.5px;min-height:62px}
.field input[type=text]{width:100%;border:1px solid var(--rule-hard);border-radius:8px;
      padding:8px 12px;background:var(--panel)}
.field select{border:1px solid var(--rule-hard);border-radius:8px;padding:8px 10px;
      background:var(--panel)}

details.adv{border-top:1px solid var(--rule);padding-top:14px;margin:0 0 24px}
details.adv summary{font-size:13px;color:var(--soft);cursor:pointer}
details.adv .row{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px}
details.adv .row .field{flex:1 1 210px;margin-bottom:0}

.nav{display:flex;gap:9px;align-items:center;border-top:1px solid var(--rule);padding-top:16px}
.nav .hint{margin-left:auto;font-size:12px;color:var(--soft)}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--rule-hard);
    border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:var(--paper)}

/* ---------- trajectories ---------- */
.turn{border:1px solid var(--rule-hard);border-radius:10px;background:var(--panel);
      padding:13px 15px;margin:0 0 12px}
.turn-h{display:flex;align-items:center;gap:9px;margin:0 0 9px}
.turn-h .n{font-family:var(--mono);font-size:12px;color:var(--soft)}
.turn-h .rm{margin-left:auto;border:0;background:none;color:var(--soft);font-size:12.5px;padding:2px 6px}
.turn-h .rm:hover{color:var(--no)}
.turn textarea{width:100%;border:1px solid var(--rule);border-radius:7px;padding:9px 11px;
      font-family:var(--mono);font-size:13.5px;min-height:60px;resize:vertical;background:var(--paper)}
.turn .meta{font-size:12.5px;color:var(--soft);margin:7px 0 0;line-height:1.45}
.turn .meta em{font-style:normal;color:var(--ink)}
.badge{font-size:11.5px;border:1px solid var(--rule-hard);border-radius:5px;padding:1px 7px;
       background:var(--paper);color:var(--soft)}
.badge.draft{background:var(--accent-bg);border-color:#C3D2E4;color:var(--accent)}
.badge.todo{background:var(--no-bg);border-color:#E3CDB8;color:var(--no)}

/* ---------- export sheet ---------- */
dialog{border:1px solid var(--rule-hard);border-radius:12px;padding:0;max-width:660px;
       width:calc(100% - 40px);background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(20,32,43,.34)}
.dlg-h{padding:16px 20px 12px;border-bottom:1px solid var(--rule);display:flex;align-items:center}
.dlg-h h2{margin:0;font-family:var(--serif);font-size:18px;font-weight:600}
.dlg-h .x{margin-left:auto;border:0;background:none;color:var(--soft);font-size:19px;line-height:1}
.dlg-b{padding:16px 20px 20px}
.dlg-b p{margin:0 0 12px;font-size:13.5px;color:var(--soft)}
.dlg-b textarea{width:100%;height:190px;font-family:var(--mono);font-size:12px;
      border:1px solid var(--rule-hard);border-radius:8px;padding:10px;background:var(--paper)}
.dlg-actions{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0 0}
.saved{font-size:12px;color:var(--soft)}

@media (max-width:820px){
  .rail{position:static;width:100%;flex:0 0 auto;max-height:none;border-right:0;
        border-bottom:1px solid var(--rule-hard)}
  .main{flex-direction:column}
  .list{max-height:210px}
  .stage-in{padding:20px 18px 70px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">Bateria IC-002 <span>· redacció de casos</span></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-casos" aria-selected="true">Casos</button>
      <button role="tab" id="tab-traj" aria-selected="false">Trajectòries</button>
    </div>
    <div class="bar-end">
      <span class="count" id="count"></span>
      <span class="saved" id="saved"></span>
      <button class="btn" id="btn-load">Carrega còpia</button>
      <button class="btn primary" id="btn-export">Exporta</button>
    </div>
  </header>
  <div class="main">
    <aside class="rail">
      <div class="grid-wrap" id="grid-wrap"></div>
      <div class="list" id="list"></div>
    </aside>
    <main class="stage"><div class="stage-in" id="stage"></div></main>
  </div>
</div>

<dialog id="dlg">
  <div class="dlg-h"><h2 id="dlg-t">Exporta</h2><button class="x" id="dlg-x" aria-label="Tanca">✕</button></div>
  <div class="dlg-b">
    <p id="dlg-p"></p>
    <textarea id="dlg-ta" spellcheck="false"></textarea>
    <div class="dlg-actions" id="dlg-actions"></div>
  </div>
</dialog>
<input type="file" id="file" accept=".json" hidden>

<script>
const DATA = {"ctx":{"enunciat":"Es vol estimar quin PERCENTATGE dels adolescents de 14 a 16 anys d'una ciutat dorm menys de 7 hores les nits de diari (de diumenge a dijous).\n\nPer fer-ho, durant una setmana es pregunta cada matí, a l'entrada de la primera classe de les 8h, a adolescents triats a l'atzar: «aquesta nit has dormit menys de 7 hores?». Es recullen 100 respostes en total (repartides de dilluns a divendres). En resulten 45 «sí» de 100, és a dir una proporció mostral:\n  - p̂ = 45/100 = 0,45 (un 45%)\n\nAmb aquestes dades es construeix un interval de confiança del 95% per a la proporció poblacional p. La dispersió no s'estima a part: per a una variable sí/no, ja ve donada per p̂(1−p̂). L'error estàndard és √(p̂(1−p̂)/n) i, com que no s'estima cap altra cosa, s'usa la distribució normal (z = 1,96 per al 95%). S'obté:\n\n  [0,352 ; 0,548] = [35,2% ; 54,8%]","passos":[{"num":1,"text":"L'interval és [35,2% ; 54,8%]: un marge de ±9,8 punts al voltant del 45%. Aquest marge mesura la incertesa de l'estimació. Fixa't que aquí, a diferència del cas d'una mitjana amb dades numèriques, no hem mesurat cap desviació estàndard a part: cada persona només ha dit «sí» o «no». D'on surt, doncs, la dispersió d'aquest marge?","canonical":"D'on surt la dispersió del marge ±9,8 punts, si aquí no hem mesurat cap desviació estàndard com faríem amb dades numèriques?","nuclear":"La dispersió d'una proporció no s'estima a part: surt de la pròpia proporció, p(1-p), que és MÀXIMA a 0,5 i petita als extrems. (El paper de la mida de mostra n sota l'arrel és context vàlid, però NO és el requisit d'aquest pas.)","typical":"Creure que cal una desviació estàndard externa per al marge, sense veure que la dispersió surt sola de p(1-p).","likely":"PROP_se_lliure"},{"num":2,"text":"Has construït l'interval correctament. Ara fixem-nos en com es van recollir les dades. S'ha repetit exactament el mateix estudi, amb la mateixa mida de mostra (n = 100), però preguntant a les 11.30h en lloc de a les 8h. I el resultat ha canviat: ara surten 58 «sí» de 100 (un 58%), amb interval [48,3% ; 67,7%]. Si és la mateixa ciutat i la mateixa mida de mostra, per què surten desplaçats? (Pista de fons, per si t'ajuda: a les 8h, a primera classe, hi ha qui encara no ha arribat.)","canonical":"Mateixa ciutat i mateixa n, però la de les 8h dona 45% i la de les 11.30h dona 58%. Per què es desplacen tant?","nuclear":"El desplaçament entre els dos intervals és la prova que el MÈTODE de mostreig influeix en el resultat: hi ha biaix de selecció (no és atzar de mostreig). (Que la 8h infravalori, o que la 11.30h sigui «menys dolenta» i no «la veritat», són matisos vàlids però NO són el requisit d'aquest pas.)","typical":"No veure que el desplaçament ve del MÈTODE de recollida (biaix de selecció), sinó atribuir-lo a l'atzar de tenir dues mostres diferents.","likely":"BIAS_n_no_corregeix"},{"num":3,"text":"Hem treballat amb un 95% de confiança i ha sortit [35,2% ; 54,8%]. Si l'equip hagués volgut estar moltíssim més segur —diguem un 99,99%— què li passaria a l'amplada de l'interval? (I portat a l'extrem, amb una mostra ridícula de 4 persones, l'interval s'estiraria fins a gairebé [0%, 100%]: cert, però inútil. Per això no es demana sempre el màxim de confiança.)","canonical":"Si en lloc del 95% es demana un 99,99% de confiança, què li passa a l'amplada de l'interval?","nuclear":"Pujar el nivell de confiança EIXAMPLA el marge (puja z: 1,96 → 3,89 per al 99,99%). Més confiança no és gratis. (Que a l'extrem l'interval ompli tot el rang [0%,100%] i sigui vàcuament cert però inútil és una bona conclusió, però NO cal que l'alumne hi arribi sol per superar el pas.)","typical":"Creure que més confiança és sempre millor ('posem 99,99% i som més rigorosos') sense veure que això eixampla el marge.","likely":"CONF_mes_sempre_millor"}],"prereq":{"id":"PRE-VARP","question":"Abans de seguir, aclarim una peça clau d'aquest problema. Quan estimem un percentatge (una proporció p), la incertesa no és la mateixa per a tots els valors de p: és MÀXIMA quan p ronda el 50% i mínima quan p s'acosta al 0% o al 100%. Per què? Pensa en l'expressió p(1-p): on és més gran, i què vol dir això sobre com de segurs estem segons el percentatge estimat?","explanation":"**La variància d'una proporció no és lliure: està lligada a la pròpia p.**\n\nPer a una variable sí/no (Bernoulli), la variància de cada observació val exactament **p(1-p)**. Aquesta expressió:\n\n- val **0** als extrems (p=0 o p=1): si tothom respon igual, no hi ha cap dispersió;\n- és **màxima a p=0,5** (val 0,25): quan la població està partida per la meitat, és quan hi ha més incertesa.\n\nConseqüència 1: l'error estàndard de la proporció és **√(p(1-p)/n)** — i no cal mesurar cap desviació estàndard a part, perquè el percentatge ja conté la seva pròpia dispersió.\n\nConseqüència 2: com que no estimem cap σ amb una mostra a part, **tornem a la z** (1,96 per al 95%), no a la t de Student."},"codis":["PROP_se_lliure","PROP_var_max_50","BIAS_n_no_corregeix","BIAS_premature","CONF_mes_sempre_millor","KEY_only","GEN_other"],"catalog":{"PROP_se_lliure":"No veu que la variància d'una proporció està LLIGADA a p (val p(1-p)) i busca una desviació estàndard externa, com si calgués mesurar-la a part igual que amb una variable contínua. No reconeix que el percentatge ja conté la seva pròpia dispersió.","PROP_var_max_50":"No percep que la incertesa (la variància p(1-p)) és MÀXIMA quan p ronda el 50% i mínima als extrems: creu que la precisió no depèn de quin sigui el percentatge estimat.","BIAS_n_no_corregeix":"Creu que augmentar la mida de la mostra corregeix el biaix de selecció. No veu que n redueix l'AMPLADA (via √(p(1-p)/n)) però mai el BIAIX (el desplaçament del centre): una mostra esbiaixada gran és igual de descentrada, només amb més falsa seguretat.","BIAS_premature":"Treu el problema del biaix de selecció durant el Pas 1 (que treballa la construcció del marge). No és un error conceptual —és bona intuïció—, però toca ap let S = load() || {casos:structuredClone(DATA.casos), traj:structuredClone(DATA.traj)};
let view = "casos", curCase = 0, curTraj = 0, filter = null;

function save(){
  try{ localStorage.setItem("bateria-ic002", JSON.stringify(S));
       el("saved").textContent = "desat " + new Date().toLocaleTimeString("ca-ES",{hour:"2-digit",minute:"2-digit"});
  }catch(e){ el("saved").textContent = "sense desat automàtic — exporta sovint"; }
}
function load(){ try{ const r = localStorage.getItem("bateria-ic002"); return r?JSON.parse(r):null; }catch(e){ return null; } }
function el(id){ return document.getElementById(id); }
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function filled(c){ return (c.input_alumne||"").trim().length > 0; }

function stepCtx(pas){
  if(pas === "PRE") return {
    who:"🐍 Python · pregunta del reforç PRE-VARP",
    body: DATA.ctx.prereq.question, q:null,
    note:"L'alumne hi arriba després que el tutor decideixi retrocedir. Ve d'estar encallat al Pas 1.",
    nuclear:"La variància val p(1-p) I és màxima a 0,5. Calen les dues parts.",
    typical:"Creure que la precisió no depèn de quin sigui el percentatge estimat."
  };
  const s = DATA.ctx.passos[+pas-1];
  if(pas === "1") return {
    who:"🐍 Python · obertura de la sessió",
    body: DATA.ctx.enunciat, q: s.text,
    note:"És literalment el que munta new_session(): l'enunciat sencer més el text del Pas 1. L'alumne no ha dit res encara.",
    nuclear:s.nuclear, typical:s.typical
  };
  return {
    who:"🐍 Python · pregunta canònica del Pas "+pas,
    body:null, q: s.canonical,
    note:"L'alumne acaba de tancar el Pas "+(+pas-1)+". Just abans d'això ha llegit una frase curta de transició escrita per la IA (🤖), que varia. La pregunta, en canvi, la injecta sempre Python igual.",
    nuclear:s.nuclear, typical:s.typical
  };
}

function renderGrid(){
  const tot = {}, done = {};
  S.casos.forEach(c=>{ const k=c.pas+"|"+c.categoria; tot[k]=(tot[k]||0)+1; if(filled(c)) done[k]=(done[k]||0)+1; });
  let h = '<p class="grid-title">Cobertura per cel·la</p><table class="cov"><tr><th class="rh"></th>';
  PAS_ORDER.forEach(p=> h += `<th>${p==="PRE"?"PRE":"Pas "+p}</th>`);
  h += "</tr>";
  CAT_ORDER.forEach(cat=>{
    h += `<tr><th class="rh">${cat}</th>`;
    PAS_ORDER.forEach(p=>{
      const k=p+"|"+cat, t=tot[k]||0, d=done[k]||0;
      if(!t){ h += '<td><span class="cell void"></span></td>'; return; }
      const pct = Math.round(d/t*100);
      h += `<td><button class="cell" data-done="${d===t?1:0}" data-f="${k}"
        aria-current="${filter===k}" title="${cat} · ${p==="PRE"?"reforç":"Pas "+p}">
        <span class="fill" style="height:${pct}%"></span><span class="n">${d}/${t}</span></button></td>`;
    });
    h += "</tr>";
  });
  h += `</table><p class="cov-legend">Files: categoria. Columnes: pas. Clica una cel·la per filtrar-la.</p>`;
  el("grid-wrap").innerHTML = h;
  el("grid-wrap").querySelectorAll(".cell[data-f]").forEach(b=>{
    b.onclick = ()=>{ filter = (filter===b.dataset.f) ? null : b.dataset.f;
      const i = S.casos.findIndex(c=> !filter || c.pas+"|"+c.categoria===filter);
      if(i>=0) curCase=i; render(); };
  });
}

/* ---------- case list ---------- */
function visibleCases(){
  return S.casos.map((c,i)=>({c,i})).filter(({c})=> !filter || c.pas+"|"+c.categoria===filter);
}
function renderList(){
  const vis = visibleCases();
  let h = `<div class="list-h"><h3>${filter? filter.replace("|"," · ") : "Tots els casos"} (${vis.length})</h3>`;
  if(filter) h += `<button id="clearf">mostra'ls tots</button>`;
  h += "</div>";
  vis.forEach(({c,i})=>{
    const pk = filled(c) ? esc(c.input_alumne.slice(0,54)) : "—";
    h += `<button class="item" data-i="${i}" data-filled="${filled(c)?1:0}" aria-current="${i===curCase}">
      <span class="dot"></span><span class="lbl">${c.id.replace("IC002-","")}</span>
      <span class="pk">${pk}</span></button>`;
  });
  el("list").innerHTML = h;
  el("list").querySelectorAll(".item").forEach(b=> b.onclick = ()=>{ curCase=+b.dataset.i; render(); });
  const cf = el("clearf"); if(cf) cf.onclick = ()=>{ filter=null; render(); };
}

/* ---------- case editor ---------- */
function renderCase(){
  const c = S.casos[curCase]; if(!c){ el("stage").innerHTML=""; return; }
  const cat = CATS[c.categoria], ctx = stepCtx(c.pas);
  const yes = c.expected_advance === "si";
  let h = `<div class="crumb">
      <span class="id">${esc(c.id)}</span>
      <span class="chip">${c.pas==="PRE"?"Reforç PRE-VARP":"Pas "+c.pas}</span>
      <span class="chip">${cat.n} · ${cat.tip}</span>
      <span class="chip ${yes?"yes":"no"}">${yes?"ha d'avançar":"no ha d'avançar"}</span>
    </div>

    <div class="bubble"><div class="who">${ctx.who}</div><div class="body">${
      esc(ctx.body||"")}${ctx.q?`<span class="q">${esc(ctx.q)}</span>`:""}</div></div>
    <p class="src-note">${esc(ctx.note)}</p>

    <dl class="brief">
      <dt>Idea nuclear — l'únic que cal per avançar</dt><dd>${esc(ctx.nuclear)}</dd>
      <dt>Error típic del pas</dt><dd>${esc(ctx.typical)}</dd>
      <dt>Aquesta cel·la</dt><dd>${esc(cat.desc)}</dd>
    </dl>

    <div class="field">
      <label for="ans">Què respon l'alumne</label>
      <p class="help">Escriu-ho tal com ho diria ell, amb les seves faltes i el seu registre. Va literal al CSV.</p>
      <textarea id="ans" class="answer" spellcheck="false">${esc(c.input_alumne)}</textarea>
    </div>

    <div class="field">
      <label for="note">Per què l'etiquetes així</label>
      <p class="help">Una frase. Serveix per resoldre les discussions de d'aquí tres mesos, quan el cas falli i no recordis si la culpa és del model o de l'etiqueta.</p>
      <textarea id="note" class="note">${esc(c.notes_autor)}</textarea>
    </div>

    <details class="adv"><summary>Avançat — acció preferida, codi de diagnòstic, etiquetes</summary>
      <div class="row">
        <div class="field"><label for="act">Acció preferida</label>
          <p class="help">Només informatiu.</p>
          <select id="act">${["advance","stay","retreat_to_prereq"].map(a=>
            `<option ${a===c.expected_action?"selected":""}>${a}</option>`).join("")}</select></div>
        <div class="field"><label for="diag">Codi de diagnòstic</label>
          <p class="help">No bloquejant.</p>
          <select id="diag"><option value=""></option>${DATA.ctx.codis.map(k=>
            `<option ${k===c.expected_diagnostic?"selected":""}>${k}</option>`).join("")}</select></div>
        <div class="field"><label for="tags">Etiquetes</label>
          <p class="help">Separades per punt i coma.</p>
          <input type="text" id="tags" value="${esc(c.tags)}"></div>
      </div>
    </details>

    <div class="nav">
      <button class="btn" id="prev">Anterior</button>
      <button class="btn primary" id="next">Següent buit</button>
      <span class="hint"><kbd>Ctrl</kbd>+<kbd>↵</kbd> per saltar al següent buit</span>
    </div>`;
  el("stage").innerHTML = h;

  const bind=(id,key)=>{ const n=el(id); n.oninput = ()=>{ c[key]=n.value; save();
      if(id==="ans"){ renderGrid(); renderList(); } }; };
  bind("ans","input_alumne"); bind("note","notes_autor"); bind("tags","tags");
  el("act").onchange = e=>{ c.expected_action=e.target.value; save(); };
  el("diag").onchange = e=>{ c.expected_diagnostic=e.target.value; save(); };
  el("prev").onclick = ()=>{ const v=visibleCases(); const p=v.findIndex(x=>x.i===curCase);
      if(p>0){ curCase=v[p-1].i; render(); } };
  el("next").onclick = nextEmpty;
  el("ans").focus();
}
function nextEmpty(){
  const v = visibleCases(); const p = v.findIndex(x=>x.i===curCase);
  const after = v.slice(p+1).find(x=>!filled(x.c)) || v.find(x=>!filled(x.c)) || v[Math.min(p+1,v.length-1)];
  if(after){ curCase = after.i; render(); }
}

/* ---------- trajectories ---------- */
function renderTrajList(){
  el("grid-wrap").innerHTML = `<p class="grid-title">10 trajectòries multi-torn</p>
    <p class="cov-legend">Proven el que un torn aïllat no pot tocar: parroting, tancament,
    frustració, el cicle del reforç. Els torns de l'alumne són fixos; el tutor es genera.</p>`;
  let h = `<div class="list-h"><h3>Trajectòries</h3></div>`;
  S.traj.forEach((t,i)=>{
    const done = t.torns.every(x=>(x.student||"").trim());
    h += `<button class="item" data-i="${i}" data-filled="${done?1:0}" aria-current="${i===curTraj}">
      <span class="dot"></span><span class="lbl">${t.id.replace("IC002-","")}</span>
      <span class="pk">${esc(t.titol.split("—")[0])}</span></button>`;
  });
  el("list").innerHTML = h;
  el("list").querySelectorAll(".item").forEach(b=> b.onclick=()=>{ curTraj=+b.dataset.i; render(); });
}
function renderTraj(){
  const t = S.traj[curTraj]; if(!t) return;
  const st = t.estat||"";
  const badge = st.startsWith("necessita") ? '<span class="badge todo">per escriure</span>'
              : '<span class="badge draft">esborrany meu — revisa\'l</span>';
  let h = `<div class="crumb"><span class="id">${esc(t.id)}</span>
      <span class="chip">${t.start.prereq?"Comença dins el reforç":"Comença al Pas "+t.start.step}</span>
      ${badge}</div>
    <h2 style="font-family:var(--serif);font-size:21px;margin:0 0 6px;line-height:1.3">${esc(t.titol)}</h2>
    ${t.notes?`<p class="src-note">${esc(t.notes)}</p>`:""}
    ${t.avis?`<p class="src-note">⚠ ${esc(t.avis)}</p>`:""}
    <div id="turns"></div>
    <div class="nav"><button class="btn" id="addturn">Afegeix un torn</button>
      <span class="hint">L'alumne parla; el tutor respon i el genera el model.</span></div>`;
  el("stage").innerHTML = h;
  const box = el("turns");
  t.torns.forEach((tn,i)=>{
    const yes = tn.expected_advance === "si";
    const d = document.createElement("div"); d.className = "turn";
    d.innerHTML = `<div class="turn-h"><span class="n">torn ${i+1}</span>
        <span class="chip ${yes?"yes":"no"}">${yes?"ha d'avançar":"no ha d'avançar"}</span>
        <button class="rm">treu</button></div>
      <textarea spellcheck="false" placeholder="Què diu l'alumne en aquest torn">${esc(tn.student)}</textarea>
      ${tn.notes?`<p class="meta"><em>Intenció:</em> ${esc(tn.notes)}</p>`:""}`;
    d.querySelector("textarea").oninput = e=>{ tn.student=e.target.value; save(); renderTrajList(); };
    d.querySelector(".rm").onclick = ()=>{ t.torns.splice(i,1); save(); render(); };
    box.appendChild(d);
  });
  el("addturn").onclick = ()=>{ t.torns.push({student:"",expected_advance:"no",notes:""}); save(); render(); };
}

/* ---------- export ---------- */
function toCSV(){
  const cols = ["id","pas","categoria","input_alumne","expected_advance",
                "expected_action","expected_diagnostic","tags","notes_autor"];
  const q = v => '"' + String(v==null?"":v).replace(/"/g,'""') + '"';
  return [cols.map(q).join(",")]
    .concat(S.casos.filter(filled).map(c=>cols.map(k=>q(c[k])).join(","))).join("\r\n");
}
function toTrajJSON(){ return JSON.stringify(S.traj,null,1); }
function toBackup(){ return JSON.stringify(S); }
function download(name, text, mime){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:mime+";charset=utf-8"}));
  a.download=name; a.click(); URL.revokeObjectURL(a.href);
}
function openExport(){
  const n = S.casos.filter(filled).length;
  el("dlg-t").textContent = "Exporta";
  el("dlg-p").textContent = `${n} casos escrits de ${S.casos.length}. El quadre de sota és el CSV: `
    + `copia'l i enganxa'l al xat, o baixa els fitxers.`;
  el("dlg-ta").value = toCSV();
  el("dlg-actions").innerHTML = `
    <button class="btn primary" id="e-copy">Copia el CSV</button>
    <button class="btn" id="e-csv">Baixa casos.csv</button>
    <button class="btn" id="e-traj">Baixa trajectories.json</button>
    <button class="btn" id="e-bak">Baixa còpia de seguretat</button>`;
  el("e-copy").onclick = async e=>{ el("dlg-ta").select();
    try{ await navigator.clipboard.writeText(toCSV()); e.target.textContent="Copiat"; }
    catch(_){ document.execCommand("copy"); e.target.textContent="Copiat"; }
    setTimeout(()=>e.target.textContent="Copia el CSV",1600); };
  el("e-csv").onclick  = ()=> download("casos_IC002.csv", "\ufeff"+toCSV(), "text/csv");
  el("e-traj").onclick = ()=> download("trajectories_IC002.json", toTrajJSON(), "application/json");
  el("e-bak").onclick  = ()=> download("bateria_copia.json", toBackup(), "application/json");
  el("dlg").showModal();
}

/* ---------- wiring ---------- */
function render(){
  el("count").innerHTML = `<b>${S.casos.filter(filled).length}</b>/${S.casos.length} casos`;
  el("tab-casos").setAttribute("aria-selected", view==="casos");
  el("tab-traj").setAttribute("aria-selected", view==="traj");
  if(view==="casos"){ renderGrid(); renderList(); renderCase(); }
  else { renderTrajList(); renderTraj(); }
}
el("tab-casos").onclick = ()=>{ view="casos"; render(); };
el("tab-traj").onclick  = ()=>{ view="traj";  render(); };
el("btn-export").onclick = openExport;
el("dlg-x").onclick = ()=> el("dlg").close();
el("btn-load").onclick = ()=> el("file").click();
el("file").onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ try{ const d=JSON.parse(r.result);
      if(d.casos&&d.traj){ S=d; curCase=0; curTraj=0; filter=null; save(); render(); }
      else alert("Aquest fitxer no és una còpia de seguretat de la bateria."); }
    catch(_){ alert("No s'ha pogut llegir el fitxer."); } };
  r.readAsText(f); e.target.value="";
};
document.addEventListener("keydown", e=>{
  if((e.ctrlKey||e.metaKey) && e.key==="Enter" && view==="casos"){ e.preventDefault(); nextEmpty(); }
});
render();
</script>
</body>
</html>
